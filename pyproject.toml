[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-capsule"
version = "0.1.1"
description = "A portable ZIP format for reproducible agent eval cases: inputs, fixtures, assertions and provenance hashes travel together."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "yashkhou"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
